# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
# stages 未指定のフックは pre-commit でだけ実行される
default_stages = ["pre-commit"]
# prek install で pre-commit と pre-push の両方の Git フックを入れる
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "clang-format",
    name = "clang-format",
    entry = "clang-format --dry-run --Werror",
    language = "system",
    types_or = ["c", "c++"],
    files = "^c-api/",
    priority = 5,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    # macOS では Apple Container 上の Linux コンテナで aarch64 ターゲットの clippy を実行する
    # 事前に `make container-build` でイメージ (v4l2-ci-check) を用意しておくこと
    # ソースは bind mount するので Rust ファイルの編集はコンテナ再ビルドなしで反映される
    # ホストの target/ と衝突しないようコンテナ内では CARGO_TARGET_DIR=/tmp/cargo-target を使う
    entry = "sh -c 'case \"$(uname -s)\" in Darwin) container run --rm -v \"$(pwd):/workspace\" -w /workspace -e CARGO_TARGET_DIR=/tmp/cargo-target v4l2-ci-check cargo clippy --workspace --all-targets --target aarch64-unknown-linux-gnu -- -D warnings;; *) cargo clippy --workspace --all-targets -- -D warnings;; esac'",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-test",
    name = "cargo test (Linux aarch64 only)",
    # コミットを遅くしないため pre-push でだけ実行する
    # V4L2 M2M デバイスを必要とする統合テストは Raspberry Pi (Linux aarch64) でのみ実行できる
    # macOS やその他の環境ではスキップする
    entry = "sh -c 'case \"$(uname -sm)\" in Darwin*) echo \"Skipped on macOS\"; exit 0;; \"Linux aarch64\") cargo test --workspace;; *) echo \"Skipped on $(uname -sm)\"; exit 0;; esac'",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    stages = ["pre-push"],
    priority = 20,
  },
]
