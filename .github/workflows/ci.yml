name: ci

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "pbt/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

jobs:
  build:
    name: Build (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PKG_CONFIG_SYSROOT_DIR: /opt/rpi-sysroot
      PKG_CONFIG_LIBDIR: /opt/rpi-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/rpi-sysroot/usr/share/pkgconfig
      PKG_CONFIG_ALLOW_CROSS: "1"
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=--sysroot=/opt/rpi-sysroot"
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu: "--target=aarch64-linux-gnu --sysroot=/opt/rpi-sysroot"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - run: rustup update stable
      - run: rustup target add aarch64-unknown-linux-gnu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap crossbuild-essential-arm64 libclang-dev pkg-config
      - name: Build aarch64 sysroot
        run: |
          sudo mmdebstrap \
            --variant=extract \
            --architectures=arm64 \
            --include=libcamera-dev,libc6-dev \
            trixie /opt/rpi-sysroot \
            "deb [trusted=yes] http://deb.debian.org/debian trixie main" \
            "deb [trusted=yes] http://archive.raspberrypi.com/debian trixie main"
          # /dev 内のシンボリックリンクは不要なので削除する
          sudo rm -rf /opt/rpi-sysroot/dev
          # usrmerge シンボリックリンクを作成する（リンカスクリプト内の絶対パス /lib/... を解決するため）
          sudo ln -sf usr/lib /opt/rpi-sysroot/lib
      - run: cargo fmt --all --check
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu
      - run: cargo clippy --workspace --target aarch64-unknown-linux-gnu -- -D warnings
      - name: Build examples
        run: |
          cargo build -p v4l2_m2m_check --target aarch64-unknown-linux-gnu --release
          cargo build -p v4l2_m2m_encode --target aarch64-unknown-linux-gnu --release
          cargo build --manifest-path examples/v4l2_m2m_libcamera_encode/Cargo.toml --target-dir target --target aarch64-unknown-linux-gnu --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4l2-examples-aarch64
          path: |
            target/aarch64-unknown-linux-gnu/release/v4l2_m2m_check
            target/aarch64-unknown-linux-gnu/release/v4l2_m2m_encode
            target/aarch64-unknown-linux-gnu/release/v4l2_m2m_libcamera_encode
          if-no-files-found: error
  verify:
    name: Verify (Raspberry Pi)
    needs: build
    runs-on:
      group: Self
      labels: [self-hosted, linux, ARM64, Raspberry-Pi]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v4l2-examples-aarch64
      - name: Reset bcm2835-codec module
        run: |
          sudo modprobe -r bcm2835_codec 2>/dev/null || true
          sudo modprobe bcm2835_codec
          # VPU (VideoCore) 側の MMAL/VCHI 再初期化を待つ
          sleep 3
      - name: Run check
        run: |
          chmod +x v4l2_m2m_check
          ./v4l2_m2m_check
      - name: Reset bcm2835-codec module (check 後のリセット)
        run: |
          sudo modprobe -r bcm2835_codec
          sudo modprobe bcm2835_codec
          sleep 3
      - name: Diagnose bcm2835-codec
        run: |
          echo "=== v4l2-ctl version ==="
          v4l2-ctl --version
          echo "=== current OUTPUT format ==="
          v4l2-ctl -d /dev/video11 --get-fmt-video-out-mplane 2>&1 || \
            v4l2-ctl -d /dev/video11 --get-fmt-video-out 2>&1 || true
          echo "=== current CAPTURE format ==="
          v4l2-ctl -d /dev/video11 --get-fmt-video-mplane 2>&1 || \
            v4l2-ctl -d /dev/video11 --get-fmt-video 2>&1 || true
      - name: Run encode (bcm2835-codec 単体動作確認)
        run: |
          chmod +x v4l2_m2m_encode
          ./v4l2_m2m_encode --frames 30 --output /tmp/encode_test.mp4 || (echo "=== dmesg ===" && dmesg | tail -30 && exit 1)
      - name: Run libcamera_encode
        run: |
          chmod +x v4l2_m2m_libcamera_encode
          ./v4l2_m2m_libcamera_encode --duration 3 --output /tmp/test.mp4 || (echo "=== dmesg ===" && dmesg | tail -30 && exit 1)
